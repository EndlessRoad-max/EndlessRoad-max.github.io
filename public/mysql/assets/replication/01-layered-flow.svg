<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1150" viewBox="0 0 1440 1150" role="img" aria-labelledby="title desc"><title id="title">一条 INSERT 如何到达从库：服务层交互，文件层保存日志</title><desc id="desc">两台数据库均分为服务层、InnoDB存储引擎层、文件层。主库Dump线程和从库接收线程通过MySQL协议连接。</desc><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#00758f"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#277448"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#586b78"/></marker><marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b07522"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="36" y="45" font-size="29" fill="#223442" font-weight="700" text-anchor="start">一条 INSERT 如何到达从库：服务层交互，文件层保存日志</text><text x="36" y="80" font-size="21" fill="#586b78" font-weight="400" text-anchor="start">示例：INSERT INTO db01.tb_user(name) VALUES (&#x27;Tom&#x27;);</text><rect x="60" y="105" width="490" height="58" rx="9" fill="#eef7fa" stroke="#00758f" stroke-width="1.6"/><text x="76" y="137" font-size="22" fill="#00758f" font-weight="700" text-anchor="start">应用 / mysql 客户端 → 主库 3306</text><text x="44" y="202" font-size="25" fill="#00758f" font-weight="700" text-anchor="start">主库 source · 192.168.200.200</text><rect x="30" y="220" width="580" height="300" rx="9" fill="#fbfcfd" stroke="#d4dde2" stroke-width="1.6"/><text x="45" y="250" font-size="21" fill="#00758f" font-weight="700" text-anchor="start">服务层</text><rect x="30" y="550" width="580" height="160" rx="9" fill="#fbfcfd" stroke="#d4dde2" stroke-width="1.6"/><text x="45" y="580" font-size="21" fill="#00758f" font-weight="700" text-anchor="start">存储引擎层</text><rect x="30" y="740" width="580" height="300" rx="9" fill="#fbfcfd" stroke="#d4dde2" stroke-width="1.6"/><text x="45" y="770" font-size="21" fill="#00758f" font-weight="700" text-anchor="start">文件层</text><text x="844" y="202" font-size="25" fill="#277448" font-weight="700" text-anchor="start">从库 replica · 192.168.200.201</text><rect x="830" y="220" width="580" height="300" rx="9" fill="#fbfcfd" stroke="#d4dde2" stroke-width="1.6"/><text x="845" y="250" font-size="21" fill="#277448" font-weight="700" text-anchor="start">服务层</text><rect x="830" y="550" width="580" height="160" rx="9" fill="#fbfcfd" stroke="#d4dde2" stroke-width="1.6"/><text x="845" y="580" font-size="21" fill="#277448" font-weight="700" text-anchor="start">存储引擎层</text><rect x="830" y="740" width="580" height="300" rx="9" fill="#fbfcfd" stroke="#d4dde2" stroke-width="1.6"/><text x="845" y="770" font-size="21" fill="#277448" font-weight="700" text-anchor="start">文件层</text><rect x="60" y="280" width="245" height="120" rx="9" fill="#eef7fa" stroke="#00758f" stroke-width="1.6"/><text x="76" y="312" font-size="22" fill="#00758f" font-weight="700" text-anchor="start">连接 / 认证 / SQL 执行</text><text x="76" y="342" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">解析 SQL，协调事务提交</text><text x="76" y="369" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">将变更组织为 binlog 事件</text><rect x="355" y="280" width="225" height="120" rx="9" fill="#eef7fa" stroke="#00758f" stroke-width="1.6"/><text x="371" y="312" font-size="22" fill="#00758f" font-weight="700" text-anchor="start">Binlog Dump 线程</text><text x="371" y="342" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">读取本机 binlog</text><text x="371" y="369" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">向从库发送事件</text><rect x="860" y="280" width="245" height="105" rx="9" fill="#eff8f2" stroke="#277448" stroke-width="1.6"/><text x="876" y="312" font-size="22" fill="#277448" font-weight="700" text-anchor="start">接收线程 receiver</text><text x="876" y="342" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">连接主库、接收事件</text><text x="876" y="369" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">也叫 I/O 线程</text><rect x="1140" y="395" width="240" height="105" rx="9" fill="#eff8f2" stroke="#277448" stroke-width="1.6"/><text x="1156" y="427" font-size="22" fill="#277448" font-weight="700" text-anchor="start">应用线程 applier</text><text x="1156" y="457" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">读取并应用中继日志</text><text x="1156" y="484" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">可由协调器分给 workers</text><rect x="60" y="595" width="245" height="90" rx="9" fill="#eef7fa" stroke="#00758f" stroke-width="1.6"/><text x="76" y="627" font-size="22" fill="#00758f" font-weight="700" text-anchor="start">InnoDB</text><text x="76" y="657" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">修改记录，维护事务与索引</text><rect x="1140" y="595" width="240" height="90" rx="9" fill="#eff8f2" stroke="#277448" stroke-width="1.6"/><text x="1156" y="627" font-size="22" fill="#277448" font-weight="700" text-anchor="start">InnoDB</text><text x="1156" y="657" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">应用变更并提交本地事务</text><rect x="60" y="800" width="245" height="90" rx="9" fill="#eef7fa" stroke="#00758f" stroke-width="1.6"/><text x="76" y="832" font-size="22" fill="#00758f" font-weight="700" text-anchor="start">redo / undo 文件</text><text x="76" y="862" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">崩溃恢复 / 回滚与旧版本</text><rect x="60" y="925" width="245" height="90" rx="9" fill="#eef7fa" stroke="#00758f" stroke-width="1.6"/><text x="76" y="957" font-size="22" fill="#00758f" font-weight="700" text-anchor="start">表空间 / 数据文件</text><text x="76" y="987" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">例如独立表空间 .ibd</text><rect x="355" y="800" width="225" height="100" rx="9" fill="#eef7fa" stroke="#00758f" stroke-width="1.6"/><text x="371" y="832" font-size="22" fill="#00758f" font-weight="700" text-anchor="start">binlog 二进制日志</text><text x="371" y="862" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">由服务层管理</text><text x="371" y="889" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">复制的事件来源</text><rect x="860" y="800" width="245" height="100" rx="9" fill="#eff8f2" stroke="#277448" stroke-width="1.6"/><text x="876" y="832" font-size="22" fill="#277448" font-weight="700" text-anchor="start">relay log 中继日志</text><text x="876" y="862" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">由接收线程写入</text><text x="876" y="889" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">由应用线程读取</text><rect x="1140" y="800" width="240" height="100" rx="9" fill="#eff8f2" stroke="#277448" stroke-width="1.6"/><text x="1156" y="832" font-size="22" fill="#277448" font-weight="700" text-anchor="start">redo / undo / 表空间</text><text x="1156" y="862" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">由存储引擎维护</text><text x="1156" y="889" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">表空间最终保存数据</text><rect x="860" y="935" width="520" height="80" rx="9" fill="#eff8f2" stroke="#277448" stroke-width="1.6"/><text x="876" y="967" font-size="22" fill="#277448" font-weight="700" text-anchor="start">从库自己的 binlog（启用时）</text><text x="876" y="997" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">log_replica_updates=ON 时也记录复制事务</text><path d="M180 163 V280" fill="none" stroke="#00758f" stroke-width="2.3"  marker-end="url(#blue)"/><path d="M180 400 V595" fill="none" stroke="#00758f" stroke-width="2.3"  marker-end="url(#blue)"/><text x="72" y="475" font-size="20" fill="#00758f" font-weight="400" text-anchor="start">① 执行与提交</text><path d="M305 335 H325 V770 H465 V800" fill="none" stroke="#00758f" stroke-width="2.3"  marker-end="url(#blue)"/><text x="334" y="728" font-size="19" fill="#00758f" font-weight="400" text-anchor="start">② 写日志</text><path d="M465 800 V400" fill="none" stroke="#00758f" stroke-width="2.3"  marker-end="url(#blue)"/><text x="477" y="570" font-size="19" fill="#00758f" font-weight="400" text-anchor="start">③ 读取</text><path d="M180 685 V800" fill="none" stroke="#00758f" stroke-width="2.3"  marker-end="url(#blue)"/><path d="M305 655 H325 V970 H305" fill="none" stroke="#00758f" stroke-width="2.3"  marker-end="url(#blue)"/><path d="M860 300 H580" fill="none" stroke="#277448" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#green)"/><text x="700" y="268" font-size="21" fill="#277448" font-weight="400" text-anchor="middle">先连接并请求</text><path d="M580 355 H860" fill="none" stroke="#00758f" stroke-width="2.3"  marker-end="url(#blue)"/><text x="710" y="391" font-size="21" fill="#00758f" font-weight="400" text-anchor="middle">④ 持续发送事件</text><text x="710" y="430" font-size="23" fill="#223442" font-weight="700" text-anchor="middle">MySQL 协议</text><text x="710" y="461" font-size="20" fill="#586b78" font-weight="400" text-anchor="middle">TLS（可选） / TCP</text><text x="710" y="490" font-size="18" fill="#586b78" font-weight="400" text-anchor="middle">连接建立在服务层之间</text><path d="M980 385 V800" fill="none" stroke="#277448" stroke-width="2.3"  marker-end="url(#green)"/><text x="992" y="570" font-size="20" fill="#277448" font-weight="400" text-anchor="start">⑤ 写中继日志</text><path d="M1105 850 H1120 V450 H1140" fill="none" stroke="#277448" stroke-width="2.3"  marker-end="url(#green)"/><text x="1160" y="540" font-size="20" fill="#277448" font-weight="400" text-anchor="start">⑥ 应用事件</text><path d="M1260 500 V595" fill="none" stroke="#277448" stroke-width="2.3"  marker-end="url(#green)"/><path d="M1260 685 V800" fill="none" stroke="#277448" stroke-width="2.3"  marker-end="url(#green)"/><text x="36" y="1080" font-size="22" fill="#223442" font-weight="700" text-anchor="start">读写日志文件的是本机 MySQL 进程；主从之间传输的是事件流，不是共享磁盘或整份数据文件。</text><text x="36" y="1116" font-size="20" fill="#586b78" font-weight="400" text-anchor="start">图中省略事务提交的 redo / binlog 协调细节；写入日志与刷到稳定存储是不同动作，取决于刷盘策略。</text></g></svg>