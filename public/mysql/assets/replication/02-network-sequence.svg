<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1385" viewBox="0 0 1400 1385" role="img" aria-labelledby="title desc"><title id="title">主从的网络交互：从库发起连接，主库连续发送日志</title><desc id="desc">从库连接主库TCP3306，经过MySQL握手、可选TLS和账号认证，再请求binlog流。接收日志和应用数据是两条执行路径。</desc><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#00758f"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#277448"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#586b78"/></marker><marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b07522"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="36" y="45" font-size="29" fill="#223442" font-weight="700" text-anchor="start">主从的网络交互：从库发起连接，主库连续发送日志</text><text x="36" y="80" font-size="21" fill="#586b78" font-weight="400" text-anchor="start">位点复制的典型顺序；每条箭头表示一次逻辑交互，底层可能拆成多个 TCP 包。</text><rect x="110" y="105" width="290" height="85" rx="9" fill="#f4f8fa" stroke="#c9d9e0" stroke-width="1.6"/><text x="255" y="139" font-size="25" fill="#277448" font-weight="700" text-anchor="middle">从库服务层</text><text x="255" y="170" font-size="19" fill="#586b78" font-weight="400" text-anchor="middle">receiver / 临时端口</text><line x1="255" y1="190" x2="255" y2="1200" stroke="#c4d1d8" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="690" y="105" width="290" height="85" rx="9" fill="#f4f8fa" stroke="#c9d9e0" stroke-width="1.6"/><text x="835" y="139" font-size="25" fill="#00758f" font-weight="700" text-anchor="middle">主库服务层</text><text x="835" y="170" font-size="19" fill="#586b78" font-weight="400" text-anchor="middle">连接处理 / 3306</text><line x1="835" y1="190" x2="835" y2="1200" stroke="#c4d1d8" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="1065" y="105" width="290" height="85" rx="9" fill="#f4f8fa" stroke="#c9d9e0" stroke-width="1.6"/><text x="1210" y="139" font-size="25" fill="#277448" font-weight="700" text-anchor="middle">从库本机</text><text x="1210" y="170" font-size="19" fill="#586b78" font-weight="400" text-anchor="middle">relay log / applier</text><line x1="1210" y1="190" x2="1210" y2="1200" stroke="#c4d1d8" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M255 235 H835" fill="none" stroke="#277448" stroke-width="2.3"  marker-end="url(#green)"/><text x="545.0" y="223" font-size="20" fill="#223442" font-weight="400" text-anchor="middle">① TCP：SYN → SYN/ACK → ACK</text><text x="545.0" y="262" font-size="17" fill="#586b78" font-weight="400" text-anchor="middle">从库主动连接主库；这一步还没有登录 MySQL</text><path d="M835 315 H255" fill="none" stroke="#00758f" stroke-width="2.3"  marker-end="url(#blue)"/><text x="545.0" y="303" font-size="20" fill="#223442" font-weight="400" text-anchor="middle">② MySQL Initial Handshake</text><text x="545.0" y="342" font-size="17" fill="#586b78" font-weight="400" text-anchor="middle">版本、能力、认证插件与随机挑战</text><path d="M255 395 H835" fill="none" stroke="#277448" stroke-width="2.3"  marker-end="url(#green)"/><text x="545.0" y="383" font-size="20" fill="#223442" font-weight="400" text-anchor="middle">③ 可选：SSLRequest，然后进行 TLS 握手</text><text x="545.0" y="422" font-size="17" fill="#586b78" font-weight="400" text-anchor="middle">开启 TLS 后，后续 MySQL 协议数据在加密通道里传输</text><path d="M255 475 H835" fill="none" stroke="#277448" stroke-width="2.3"  marker-end="url(#green)"/><text x="545.0" y="463" font-size="20" fill="#223442" font-weight="400" text-anchor="middle">④ HandshakeResponse / 认证交换</text><text x="545.0" y="502" font-size="17" fill="#586b78" font-weight="400" text-anchor="middle">提交账号与认证响应；插件可能需要额外往返</text><path d="M835 550 H255" fill="none" stroke="#00758f" stroke-width="2.3"  marker-end="url(#blue)"/><text x="545.0" y="538" font-size="20" fill="#223442" font-weight="400" text-anchor="middle">⑤ OK：认证通过；失败则 ERR 并结束</text><path d="M255 625 H835" fill="none" stroke="#277448" stroke-width="2.3"  marker-end="url(#green)"/><text x="545.0" y="613" font-size="20" fill="#223442" font-weight="400" text-anchor="middle">⑥ 复制会话准备、从库注册等</text><text x="545.0" y="652" font-size="17" fill="#586b78" font-weight="400" text-anchor="middle">细节与版本有关；这里合并展示</text><path d="M255 710 H835" fill="none" stroke="#277448" stroke-width="2.3"  marker-end="url(#green)"/><text x="545.0" y="698" font-size="20" fill="#223442" font-weight="400" text-anchor="middle">⑦ COM_BINLOG_DUMP 请求日志流</text><text x="545.0" y="737" font-size="17" fill="#586b78" font-weight="400" text-anchor="middle">携带 server_id、日志文件名、起始位置</text><path d="M835 790 H255" fill="none" stroke="#00758f" stroke-width="2.3"  marker-end="url(#blue)"/><text x="545.0" y="778" font-size="20" fill="#223442" font-weight="400" text-anchor="middle">⑧ Binlog event → event → event …</text><text x="545.0" y="817" font-size="17" fill="#586b78" font-weight="400" text-anchor="middle">同一条 TCP 长连接；无新事务时可发送 heartbeat</text><path d="M255 880 H1210" fill="none" stroke="#277448" stroke-width="2.3"  marker-end="url(#green)"/><text x="732.5" y="868" font-size="20" fill="#223442" font-weight="400" text-anchor="middle">⑨ receiver 将事件写入本机 relay log</text><text x="732.5" y="907" font-size="17" fill="#586b78" font-weight="400" text-anchor="middle">TCP 收包完成，不代表 MySQL 已刷盘，更不代表数据已应用</text><rect x="1015" y="920" width="350" height="100" rx="9" fill="#eff8f2" stroke="#277448" stroke-width="1.6"/><text x="1031" y="952" font-size="22" fill="#277448" font-weight="700" text-anchor="start">applier 在本机继续处理</text><text x="1031" y="982" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">读 relay log → 调用执行 / 引擎</text><text x="1031" y="1009" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">提交从库事务 → 查询才能看到</text><path d="M255 1085 H835" fill="none" stroke="#b07522" stroke-width="2.3"  marker-end="url(#orange)"/><text x="545.0" y="1073" font-size="20" fill="#223442" font-weight="400" text-anchor="middle">可选半同步 ACK：相关事件已写入并刷盘</text><text x="545.0" y="1112" font-size="17" fill="#586b78" font-weight="400" text-anchor="middle">普通异步复制不等待这种事务确认；TCP ACK 始终是另一回事</text><text x="36" y="1180" font-size="23" fill="#223442" font-weight="700" text-anchor="start">连接中断后</text><text x="36" y="1218" font-size="21" fill="#586b78" font-weight="400" text-anchor="start">receiver 按重试设置重新连接、重新认证，从记录的进度继续请求；已保留的日志可以继续补。</text><text x="36" y="1255" font-size="21" fill="#586b78" font-weight="400" text-anchor="start">如果主库已清理掉所需 binlog，就需要从可用备份重新初始化，不能把起点随便改成最新位置。</text><rect x="36" y="1285" width="1328" height="66" rx="9" fill="#edf6f9" stroke="#d2e5ed" stroke-width="1.6"/><text x="55" y="1326" font-size="23" fill="#00758f" font-weight="700" text-anchor="start">应用收到 COMMIT 成功 ≠ 从库已执行完成。普通异步复制下，这两条时间线独立推进。</text></g></svg>