<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc"><title id="title">在线路上传的是什么：MySQL 数据包中的 binlog 事件</title><desc id="desc">TCP字节流承载MySQL包；普通复制事件包包括MySQL包头、OK标记和binlog事件。ROW模式下DML记录行变更，DDL仍有语句事件。</desc><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#00758f"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#277448"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#586b78"/></marker><marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b07522"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="36" y="45" font-size="29" fill="#223442" font-weight="700" text-anchor="start">在线路上传的是什么：MySQL 数据包中的 binlog 事件</text><text x="36" y="84" font-size="21" fill="#586b78" font-weight="400" text-anchor="start">普通、未压缩的 binlog 网络事件示意；TLS 开启时，外层还会封装为 TLS 记录。</text><rect x="36" y="125" width="220" height="105" rx="0" fill="#eef7fa" stroke="#c4d4dd" stroke-width="1.6"/><text x="146.0" y="165" font-size="24" fill="#223442" font-weight="700" text-anchor="middle">MySQL 包头</text><text x="146.0" y="204" font-size="17" fill="#586b78" font-weight="400" text-anchor="middle">3 字节长度 + 1 字节序号</text><rect x="256" y="125" width="150" height="105" rx="0" fill="#fff5e4" stroke="#c4d4dd" stroke-width="1.6"/><text x="331.0" y="165" font-size="24" fill="#223442" font-weight="700" text-anchor="middle">0x00</text><text x="331.0" y="204" font-size="17" fill="#586b78" font-weight="400" text-anchor="middle">事件流标记</text><rect x="406" y="125" width="290" height="105" rx="0" fill="#eef7fa" stroke="#c4d4dd" stroke-width="1.6"/><text x="551.0" y="165" font-size="24" fill="#223442" font-weight="700" text-anchor="middle">事件头</text><text x="551.0" y="204" font-size="17" fill="#586b78" font-weight="400" text-anchor="middle">标准 v4 通常为 19 字节</text><rect x="696" y="125" width="430" height="105" rx="0" fill="#eff8f2" stroke="#c4d4dd" stroke-width="1.6"/><text x="911.0" y="165" font-size="24" fill="#223442" font-weight="700" text-anchor="middle">事件内容</text><text x="911.0" y="204" font-size="17" fill="#586b78" font-weight="400" text-anchor="middle">随事件类型变化</text><rect x="1126" y="125" width="238" height="105" rx="0" fill="#f4f3f8" stroke="#c4d4dd" stroke-width="1.6"/><text x="1245.0" y="165" font-size="24" fill="#223442" font-weight="700" text-anchor="middle">校验和</text><text x="1245.0" y="204" font-size="17" fill="#586b78" font-weight="400" text-anchor="middle">若启用，例如 CRC32</text><text x="36" y="279" font-size="22" fill="#223442" font-weight="400" text-anchor="start">事件头帮助识别：时间戳、事件类型、来源 server_id、事件大小、日志位置、标志。</text><rect x="36" y="320" width="640" height="155" rx="9" fill="#eef7fa" stroke="#00758f" stroke-width="1.6"/><text x="52" y="352" font-size="22" fill="#00758f" font-weight="700" text-anchor="start">ROW 模式下的一次事务（示意）</text><text x="52" y="382" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">事务边界 → 表映射 → 行变更 → 提交标记</text><text x="52" y="409" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">例：TABLE_MAP → WRITE_ROWS → XID</text><text x="52" y="436" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">一个行事件可以包含多行；并非一行就必然一个事件。</text><rect x="700" y="320" width="664" height="155" rx="9" fill="#eff8f2" stroke="#277448" stroke-width="1.6"/><text x="716" y="352" font-size="22" fill="#277448" font-weight="700" text-anchor="start">接收方如何还原</text><text x="716" y="382" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">先识别事件类型，再解释事件内容。</text><text x="716" y="409" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">DML 通常应用行变更；DDL 仍可通过语句事件执行。</text><text x="716" y="436" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">日志轮转、格式说明、心跳也各有对应事件。</text><text x="36" y="531" font-size="23" fill="#223442" font-weight="700" text-anchor="start">TCP 负责有序传输字节，不理解“事务”或“某行数据”。</text><text x="36" y="572" font-size="21" fill="#586b78" font-weight="400" text-anchor="start">MySQL 负责解释包和事件；大事件可能跨多个包，一个 TCP 包也不一定只装一个 MySQL 包。</text><text x="36" y="613" font-size="21" fill="#586b78" font-weight="400" text-anchor="start">这里解释协议结构，不要求手工构造报文；START REPLICA 后由 MySQL 自己完成这些交互。</text></g></svg>