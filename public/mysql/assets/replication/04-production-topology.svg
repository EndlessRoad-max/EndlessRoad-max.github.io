<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="865" viewBox="0 0 1400 865" role="img" aria-labelledby="title desc"><title id="title">成熟部署的分工：复制、流量入口、故障处理与备份</title><desc id="desc">示意一主两从的传统复制架构，独立路由入口、故障控制和备份。并非InnoDB Cluster的组复制图。</desc><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#00758f"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#277448"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#586b78"/></marker><marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b07522"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="36" y="45" font-size="29" fill="#223442" font-weight="700" text-anchor="start">成熟部署的分工：复制、流量入口、故障处理与备份</text><text x="36" y="80" font-size="20" fill="#586b78" font-weight="400" text-anchor="start">传统复制的一种示意部署；副本数、机房分布和同步策略由业务的数据丢失与恢复时间目标决定。</text><rect x="45" y="155" width="235" height="120" rx="9" fill="#eef7fa" stroke="#00758f" stroke-width="1.6"/><text x="61" y="187" font-size="22" fill="#00758f" font-weight="700" text-anchor="start">业务应用</text><text x="61" y="217" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">写入 / 强一致读取</text><text x="61" y="244" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">可容忍延迟的读取</text><rect x="340" y="155" width="290" height="120" rx="9" fill="#eef7fa" stroke="#00758f" stroke-width="1.6"/><text x="356" y="187" font-size="22" fill="#00758f" font-weight="700" text-anchor="start">连接入口 / 代理</text><text x="356" y="217" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">区分读写入口</text><text x="356" y="244" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">故障时更新目标</text><rect x="800" y="115" width="265" height="120" rx="9" fill="#eef7fa" stroke="#00758f" stroke-width="1.6"/><text x="816" y="147" font-size="22" fill="#00758f" font-weight="700" text-anchor="start">主库 A</text><text x="816" y="177" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">唯一业务写入点</text><text x="816" y="204" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">GTID + binlog</text><rect x="785" y="355" width="280" height="120" rx="9" fill="#eff8f2" stroke="#277448" stroke-width="1.6"/><text x="801" y="387" font-size="22" fill="#277448" font-weight="700" text-anchor="start">从库 B · 候选主库</text><text x="801" y="417" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">只读、监控复制进度</text><text x="801" y="444" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">具备接管所需资源</text><rect x="1090" y="355" width="275" height="120" rx="9" fill="#eff8f2" stroke="#277448" stroke-width="1.6"/><text x="1106" y="387" font-size="22" fill="#277448" font-weight="700" text-anchor="start">从库 C · 读副本</text><text x="1106" y="417" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">承接可延迟读取</text><text x="1106" y="444" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">按需要承担备份任务</text><path d="M280 215 H340" fill="none" stroke="#00758f" stroke-width="2.3"  marker-end="url(#blue)"/><path d="M630 190 H800" fill="none" stroke="#00758f" stroke-width="2.3"  marker-end="url(#blue)"/><text x="665" y="174" font-size="19" fill="#00758f" font-weight="400" text-anchor="start">写入口</text><path d="M630 245 H700 V415 H785" fill="none" stroke="#277448" stroke-width="2.3"  marker-end="url(#green)"/><text x="640" y="340" font-size="19" fill="#277448" font-weight="400" text-anchor="start">读入口</text><path d="M930 235 V355" fill="none" stroke="#00758f" stroke-width="2.3"  marker-end="url(#blue)"/><path d="M1040 235 V280 H1225 V355" fill="none" stroke="#00758f" stroke-width="2.3"  marker-end="url(#blue)"/><text x="1008" y="316" font-size="20" fill="#00758f" font-weight="400" text-anchor="start">异步 / 半同步复制</text><rect x="45" y="530" width="585" height="125" rx="9" fill="#fff8eb" stroke="#b07522" stroke-width="1.6"/><text x="61" y="562" font-size="22" fill="#b07522" font-weight="700" text-anchor="start">故障处理 / 管理控制面</text><text x="61" y="592" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">监测 → 隔离旧主 → 选取可用副本 → 提升并改路由</text><text x="61" y="619" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">候选进度、数据损失与重入流程都要有验证依据</text><path d="M475 530 V275" fill="none" stroke="#b07522" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#orange)"/><path d="M630 590 H920 V475" fill="none" stroke="#b07522" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#orange)"/><rect x="785" y="550" width="580" height="105" rx="9" fill="#eff8f2" stroke="#277448" stroke-width="1.6"/><text x="801" y="582" font-size="22" fill="#277448" font-weight="700" text-anchor="start">独立备份存储</text><text x="801" y="612" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">定期备份 + binlog 归档 + 恢复演练</text><text x="801" y="639" font-size="19" fill="#586b78" font-weight="400" text-anchor="start">误删会复制到从库，因此副本不能代替备份</text><path d="M1225 475 V550" fill="none" stroke="#277448" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#green)"/><rect x="45" y="710" width="1320" height="105" rx="9" fill="#f5f8fa" stroke="#d5e0e6" stroke-width="1.6"/><text x="65" y="750" font-size="24" fill="#223442" font-weight="700" text-anchor="start">监控覆盖全链路：连接、接收、应用、延迟、磁盘、备份结果、路由指向。</text><text x="65" y="788" font-size="20" fill="#586b78" font-weight="400" text-anchor="start">自动切换由管理系统完成；半同步解决确认时机，GTID 解决事务定位，它们都不会单独完成故障切换。</text></g></svg>