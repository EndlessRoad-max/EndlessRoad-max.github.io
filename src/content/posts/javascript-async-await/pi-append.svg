<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc"><title id="title">回到 Pi：为什么 C、D 会接成一条链？</title><desc id="desc">固定基线 0df5a69e · InMemorySessionStorage.appendEntry · 起初 main → B</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8293a8"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b46}.mono{font-family:Consolas,"Microsoft YaHei",monospace}</style><rect width="1000" height="710" rx="18" fill="#fff"/><text x="36" y="49" font-size="29" style="fill:#172b46" font-weight="700">回到 Pi：为什么 C、D 会接成一条链？</text><text x="36" y="84" font-size="19" style="fill:#53677f" font-weight="400">固定基线 0df5a69e · InMemorySessionStorage.appendEntry · 起初 main → B</text><rect x="36" y="116" width="448" height="492" rx="12" fill="#f3f6fa" stroke="#dae3ed"/><text x="56" y="157" font-size="23" style="fill:#2463c5" font-weight="700">当前实现：中间没有等待点</text><rect x="516" y="116" width="448" height="492" rx="12" fill="#f3f6fa" stroke="#dae3ed"/><text x="536" y="157" font-size="23" style="fill:#a55517" font-weight="700">假设改动：读完父节点后等待</text><text x="58" y="206" font-size="23" style="fill:#172b46" font-weight="400">追加 C</text><text x="58" y="249" font-size="23" style="fill:#172b46" font-weight="400">  读取 main：B</text><text x="58" y="292" font-size="23" style="fill:#172b46" font-weight="400">  创建 C，parentId = B</text><text x="58" y="335" font-size="23" style="fill:#172b46" font-weight="400">  保存 C，main → C</text><text x="58" y="378" font-size="23" style="fill:#172b46" font-weight="400">  返回 Promise</text><text x="58" y="421" font-size="23" style="fill:#172b46" font-weight="400">追加 D</text><text x="58" y="464" font-size="23" style="fill:#172b46" font-weight="400">  读取 main：C</text><text x="58" y="507" font-size="23" style="fill:#172b46" font-weight="400">  创建 D，parentId = C</text><text x="538" y="206" font-size="23" style="fill:#172b46" font-weight="400">追加 C：读取 main，得到 B</text><text x="538" y="249" font-size="23" style="fill:#172b46" font-weight="400">  await 等待写入</text><text x="538" y="292" font-size="23" style="fill:#172b46" font-weight="400">追加 D：也读到 B</text><text x="538" y="335" font-size="23" style="fill:#172b46" font-weight="400">  await 等待写入</text><text x="538" y="378" font-size="23" style="fill:#172b46" font-weight="400">C 恢复：parentId = B</text><text x="538" y="421" font-size="23" style="fill:#172b46" font-weight="400">D 恢复：parentId = B</text><text x="538" y="520" font-size="22" style="fill:#a55517" font-weight="400">同一个 lane 的两次追加</text><text x="538" y="555" font-size="22" style="fill:#a55517" font-weight="400">可能意外分叉。</text><rect x="36" y="628" width="448" height="58" rx="12" fill="#eaf7f4" stroke="#dae3ed"/><text x="56" y="662" font-size="23" style="fill:#147d78" font-weight="600">B → C → D</text><rect x="516" y="628" width="448" height="58" rx="12" fill="#fff5e9" stroke="#dae3ed"/><text x="536" y="662" font-size="23" style="fill:#a55517" font-weight="600">B → C，同时 B → D</text></svg>