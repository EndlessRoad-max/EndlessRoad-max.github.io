<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="735" viewBox="0 0 1000 735" role="img" aria-labelledby="title desc"><title id="title">await 保存进度，不占着线程等</title><desc id="desc">先算出 await 后面的表达式，再暂停当前 async 函数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8293a8"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b46}.mono{font-family:Consolas,"Microsoft YaHei",monospace}</style><rect width="1000" height="735" rx="18" fill="#fff"/><text x="36" y="49" font-size="29" style="fill:#172b46" font-weight="700">await 保存进度，不占着线程等</text><text x="36" y="84" font-size="19" style="fill:#53677f" font-weight="400">先算出 await 后面的表达式，再暂停当前 async 函数。</text><rect x="36" y="119" width="928" height="92" rx="12" fill="#edf4ff" stroke="#dae3ed"/><text x="56" y="153" font-size="23" style="fill:#2463c5" font-weight="600">const value = await fetch(&quot;/history&quot;);</text><text x="56" y="184" font-size="19" style="fill:#53677f" font-weight="400">fetch() 先发起请求，返回代表响应结果的 Promise。</text><path d="M500 211 L500 241" fill="none" stroke="#8293a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="192" y="246" width="616" height="84" rx="12" fill="#eaf7f4" stroke="#dae3ed"/><text x="212" y="280" font-size="23" style="fill:#147d78" font-weight="600">登记恢复方式，保存局部变量和执行位置</text><text x="212" y="311" font-size="19" style="fill:#53677f" font-weight="400">成功后带着值恢复；失败后在 await 处抛出。</text><path d="M500 330 L500 360" fill="none" stroke="#8293a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="192" y="365" width="616" height="84" rx="12" fill="#edf4ff" stroke="#dae3ed"/><text x="212" y="399" font-size="23" style="fill:#2463c5" font-weight="600">当前函数暂停，调用方继续</text><text x="212" y="430" font-size="19" style="fill:#53677f" font-weight="400">调用方拿到的是这个 async 函数自己的 Promise。</text><path d="M500 449 L500 484" fill="none" stroke="#8293a8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="530" y="477" font-size="19" style="fill:#53677f" font-weight="400">被等待的 Promise 确定结果</text><rect x="192" y="489" width="616" height="84" rx="12" fill="#fff5e9" stroke="#dae3ed"/><text x="212" y="523" font-size="23" style="fill:#a55517" font-weight="600">把恢复工作排入微任务</text><text x="212" y="554" font-size="19" style="fill:#53677f" font-weight="400">有机会执行时，从 await 后面继续。</text><path d="M500 573 L500 603" fill="none" stroke="#8293a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="192" y="608" width="616" height="84" rx="12" fill="#edf4ff" stroke="#dae3ed"/><text x="212" y="642" font-size="23" style="fill:#2463c5" font-weight="600">函数结束后，确定它自己的 Promise</text><text x="212" y="673" font-size="19" style="fill:#53677f" font-weight="400">普通返回值使它成功；未捕获异常使它失败。</text><text x="36" y="722" font-size="18" style="fill:#53677f" font-weight="400">函数的 Promise 与被等待的 Promise 是两个角色。图中省略返回另一个 Promise 时的状态采纳。</text></svg>