<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="602" viewBox="0 0 1000 602" role="img" aria-labelledby="title desc"><title id="title">异步等待与并行计算，是两件事</title><desc id="desc">同一个 JS 执行线程一次运行一段代码；运行环境还可以创建 Worker。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8293a8"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b46}.mono{font-family:Consolas,"Microsoft YaHei",monospace}</style><rect width="1000" height="602" rx="18" fill="#fff"/><text x="36" y="49" font-size="29" style="fill:#172b46" font-weight="700">异步等待与并行计算，是两件事</text><text x="36" y="84" font-size="19" style="fill:#53677f" font-weight="400">同一个 JS 执行线程一次运行一段代码；运行环境还可以创建 Worker。</text><text x="36" y="137" font-size="25" style="fill:#2463c5" font-weight="700">只给长循环加 async</text><text x="36" y="186" font-size="21" style="fill:#53677f" font-weight="400">主线程</text><rect x="174" y="154" width="593" height="61" rx="12" fill="#fff0e4" stroke="#eed5bd"/><text x="195" y="193" font-size="24" style="fill:#a55517" font-weight="400">for 循环持续计算，占用当前线程</text><rect x="790" y="154" width="174" height="61" rx="12" fill="#f3f6fa" stroke="#dae3ed"/><text x="810" y="193" font-size="23" style="fill:#172b46" font-weight="400">响应点击</text><text x="174" y="246" font-size="21" style="fill:#53677f" font-weight="400">循环结束之前，点击回调不能在这个线程上插进来。</text><text x="36" y="321" font-size="25" style="fill:#147d78" font-weight="700">把计算交给 Worker</text><text x="36" y="375" font-size="21" style="fill:#53677f" font-weight="400">主线程</text><rect x="174" y="344" width="210" height="62" rx="12" fill="#edf4ff" stroke="#dae3ed"/><text x="194" y="378" font-size="23" style="fill:#2463c5" font-weight="600">发送任务</text><rect x="419" y="344" width="276" height="62" rx="12" fill="#eaf7f4" stroke="#dae3ed"/><text x="439" y="378" font-size="23" style="fill:#147d78" font-weight="600">响应点击等事件</text><rect x="732" y="344" width="232" height="62" rx="12" fill="#edf4ff" stroke="#dae3ed"/><text x="752" y="378" font-size="23" style="fill:#2463c5" font-weight="600">收到计算结果</text><text x="36" y="475" font-size="21" style="fill:#53677f" font-weight="400">Worker</text><rect x="244" y="444" width="575" height="62" rx="12" fill="#edf4ff" stroke="#dae3ed"/><text x="269" y="484" font-size="24" style="fill:#2463c5" font-weight="400">另一个执行线程上进行计算</text><path d="M278 406 L278 443" fill="none" stroke="#8293a8" stroke-width="2" marker-end="url(#arrow)"/><path d="M795 443 L795 407" fill="none" stroke="#8293a8" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="558" font-size="22" style="fill:#172b46" font-weight="400">async / await：组织异步结果的先后关系。Worker：提供另一个执行线程。</text><text x="36" y="590" font-size="19" style="fill:#53677f" font-weight="400">Worker 通常通过消息交换数据，不能直接操作页面 DOM。</text></svg>