<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc"><title id="title">一段代码，三次调度位置</title><desc id="desc">浏览器普通脚本中的独立示例：先看当前代码，再看微任务，最后看定时器。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8293a8"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b46}.mono{font-family:Consolas,"Microsoft YaHei",monospace}</style><rect width="1000" height="810" rx="18" fill="#fff"/><text x="36" y="49" font-size="29" style="fill:#172b46" font-weight="700">一段代码，三次调度位置</text><text x="36" y="84" font-size="19" style="fill:#53677f" font-weight="400">浏览器普通脚本中的独立示例：先看当前代码，再看微任务，最后看定时器。</text><rect x="36" y="116" width="510" height="559" rx="12" fill="#f3f6fa" stroke="#dae3ed"/><text x="58" y="153" font-size="22" style="fill:#172b46" font-weight="400" class="mono">console.log(&quot;A&quot;);</text><text x="58" y="189" font-size="22" style="fill:#172b46" font-weight="400" class="mono">async function work() {</text><text x="58" y="225" font-size="22" style="fill:#172b46" font-weight="400" class="mono">  console.log(&quot;B&quot;);</text><text x="58" y="261" font-size="22" style="fill:#172b46" font-weight="400" class="mono">  await Promise.resolve();</text><text x="58" y="297" font-size="22" style="fill:#172b46" font-weight="400" class="mono">  console.log(&quot;C&quot;);</text><text x="58" y="333" font-size="22" style="fill:#172b46" font-weight="400" class="mono">}</text><text x="58" y="369" font-size="22" style="fill:#172b46" font-weight="400" class="mono">const p = work();</text><text x="58" y="405" font-size="22" style="fill:#172b46" font-weight="400" class="mono">p.then(() =&gt; {</text><text x="58" y="441" font-size="22" style="fill:#172b46" font-weight="400" class="mono">  console.log(&quot;D&quot;);</text><text x="58" y="477" font-size="22" style="fill:#172b46" font-weight="400" class="mono">});</text><text x="58" y="513" font-size="22" style="fill:#172b46" font-weight="400" class="mono">console.log(&quot;E&quot;);</text><text x="58" y="549" font-size="22" style="fill:#172b46" font-weight="400" class="mono">setTimeout(() =&gt; {</text><text x="58" y="585" font-size="22" style="fill:#172b46" font-weight="400" class="mono">  console.log(&quot;F&quot;);</text><text x="58" y="621" font-size="22" style="fill:#172b46" font-weight="400" class="mono">}, 0);</text><rect x="582" y="116" width="382" height="112" rx="12" fill="#edf4ff" stroke="#dae3ed"/><text x="602" y="150" font-size="23" style="fill:#2463c5" font-weight="600">当前同步代码：A B E</text><text x="602" y="181" font-size="19" style="fill:#53677f" font-weight="400">调用 work() 时立即打印 B。</text><text x="602" y="207" font-size="19" style="fill:#53677f" font-weight="400">遇到 await，回到调用方。</text><path d="M770 228 L770 265" fill="none" stroke="#8293a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="582" y="270" width="382" height="112" rx="12" fill="#eaf7f4" stroke="#dae3ed"/><text x="602" y="304" font-size="23" style="fill:#147d78" font-weight="600">微任务：C</text><text x="602" y="335" font-size="19" style="fill:#53677f" font-weight="400">恢复 work()，打印 C。</text><text x="602" y="361" font-size="19" style="fill:#53677f" font-weight="400">work() 结束，p 成功。</text><path d="M770 382 L770 419" fill="none" stroke="#8293a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="582" y="424" width="382" height="112" rx="12" fill="#eaf7f4" stroke="#dae3ed"/><text x="602" y="458" font-size="23" style="fill:#147d78" font-weight="600">本轮微任务继续：D</text><text x="602" y="489" font-size="19" style="fill:#53677f" font-weight="400">p 的 then 回调现在可执行。</text><text x="602" y="515" font-size="19" style="fill:#53677f" font-weight="400">处理新排进来的微任务。</text><path d="M770 536 L770 573" fill="none" stroke="#8293a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="582" y="578" width="382" height="97" rx="12" fill="#fff5e9" stroke="#dae3ed"/><text x="602" y="612" font-size="23" style="fill:#a55517" font-weight="600">后续定时器任务：F</text><text x="602" y="643" font-size="19" style="fill:#53677f" font-weight="400">0 毫秒不表示立即执行。</text><rect x="36" y="704" width="928" height="70" rx="12" fill="#172b46" stroke="#172b46"/><text x="62" y="750" font-size="23" style="fill:#fff" font-weight="600">控制台输出</text><text x="310" y="750" font-size="31" style="fill:#fff" font-weight="600" class="mono">A → B → E → C → D → F</text><text x="36" y="798" font-size="18" style="fill:#53677f" font-weight="400">这是浏览器事件循环的简图；完整规则还包括多个任务队列、其他检查点和渲染时机。</text></svg>