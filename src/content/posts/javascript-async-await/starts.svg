<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">调用 async 函数，会立刻进入函数体</title><desc id="desc">同样调用 f()，有无 await，改变的是后续代码何时继续。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8293a8"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b46}.mono{font-family:Consolas,"Microsoft YaHei",monospace}</style><rect width="1000" height="650" rx="18" fill="#fff"/><text x="36" y="49" font-size="29" style="fill:#172b46" font-weight="700">调用 async 函数，会立刻进入函数体</text><text x="36" y="84" font-size="19" style="fill:#53677f" font-weight="400">同样调用 f()，有无 await，改变的是后续代码何时继续。</text><rect x="36" y="115" width="448" height="383" rx="12" fill="#f3f6fa" stroke="#dae3ed"/><text x="58" y="151" font-size="25" style="fill:#2463c5" font-weight="700">没有 await</text><rect x="516" y="115" width="448" height="383" rx="12" fill="#f3f6fa" stroke="#dae3ed"/><text x="538" y="151" font-size="25" style="fill:#2463c5" font-weight="700">遇到 await</text><text x="58" y="199" font-size="22" style="fill:#172b46" font-weight="400" class="mono">async function f() {</text><text x="58" y="233" font-size="22" style="fill:#172b46" font-weight="400" class="mono">  log(&quot;B&quot;);</text><text x="58" y="267" font-size="22" style="fill:#172b46" font-weight="400" class="mono">  log(&quot;C&quot;);</text><text x="58" y="301" font-size="22" style="fill:#172b46" font-weight="400" class="mono">  return 7;</text><text x="58" y="335" font-size="22" style="fill:#172b46" font-weight="400" class="mono">}</text><text x="58" y="369" font-size="22" style="fill:#172b46" font-weight="400" class="mono">log(&quot;A&quot;);</text><text x="58" y="403" font-size="22" style="fill:#172b46" font-weight="400" class="mono">const p = f();</text><text x="58" y="437" font-size="22" style="fill:#172b46" font-weight="400" class="mono">log(&quot;D&quot;);</text><text x="538" y="199" font-size="22" style="fill:#172b46" font-weight="400" class="mono">async function f() {</text><text x="538" y="233" font-size="22" style="fill:#172b46" font-weight="400" class="mono">  log(&quot;B&quot;);</text><text x="538" y="267" font-size="22" style="fill:#172b46" font-weight="400" class="mono">  await Promise.resolve();</text><text x="538" y="301" font-size="22" style="fill:#172b46" font-weight="400" class="mono">  log(&quot;C&quot;);</text><text x="538" y="335" font-size="22" style="fill:#172b46" font-weight="400" class="mono">}</text><text x="538" y="369" font-size="22" style="fill:#172b46" font-weight="400" class="mono">log(&quot;A&quot;);</text><text x="538" y="403" font-size="22" style="fill:#172b46" font-weight="400" class="mono">const p = f();</text><text x="538" y="437" font-size="22" style="fill:#172b46" font-weight="400" class="mono">log(&quot;D&quot;);</text><rect x="36" y="518" width="448" height="93" rx="12" fill="#edf4ff" stroke="#dae3ed"/><text x="56" y="552" font-size="23" style="fill:#2463c5" font-weight="600">A → B → C → D</text><text x="56" y="583" font-size="19" style="fill:#53677f" font-weight="400">函数体执行完，调用方才继续。</text><rect x="516" y="518" width="448" height="93" rx="12" fill="#eaf7f4" stroke="#dae3ed"/><text x="536" y="552" font-size="23" style="fill:#147d78" font-weight="600">A → B → D → C</text><text x="536" y="583" font-size="19" style="fill:#53677f" font-weight="400">await 处暂停，调用方先继续。</text><text x="36" y="636" font-size="18" style="fill:#53677f" font-weight="400">log 代表 console.log。两边拿到的 p 都是 Promise；右边等待的 Promise 已经成功。</text></svg>