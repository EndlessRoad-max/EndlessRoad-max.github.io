<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-labelledby="title desc"><title id="title">等待网络时，谁在工作？</title><desc id="desc">以浏览器中的一次成功请求为例；箭头表示先后关系，不代表耗时比例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8293a8"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b46}.mono{font-family:Consolas,"Microsoft YaHei",monospace}</style><rect width="1000" height="625" rx="18" fill="#fff"/><text x="36" y="49" font-size="29" style="fill:#172b46" font-weight="700">等待网络时，谁在工作？</text><text x="36" y="84" font-size="19" style="fill:#53677f" font-weight="400">以浏览器中的一次成功请求为例；箭头表示先后关系，不代表耗时比例。</text><rect x="36" y="117" width="448" height="74" rx="12" fill="#edf4ff" stroke="#dae3ed"/><text x="56" y="151" font-size="23" style="fill:#2463c5" font-weight="600">JavaScript 主线程</text><rect x="566" y="117" width="398" height="74" rx="12" fill="#eaf7f4" stroke="#dae3ed"/><text x="586" y="151" font-size="23" style="fill:#147d78" font-weight="600">浏览器 / 网络系统</text><rect x="36" y="218" width="448" height="82" rx="12" fill="#edf4ff" stroke="#dae3ed"/><text x="56" y="252" font-size="23" style="fill:#2463c5" font-weight="600">调用 fetch()，在 await 处暂停</text><text x="56" y="283" font-size="19" style="fill:#53677f" font-weight="400">当前函数交回控制权。</text><path d="M484 253 L566 253" fill="none" stroke="#8293a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="566" y="218" width="398" height="205" rx="12" fill="#eaf7f4" stroke="#dae3ed"/><text x="586" y="252" font-size="23" style="fill:#147d78" font-weight="600">处理网络请求</text><text x="586" y="283" font-size="19" style="fill:#53677f" font-weight="400">等待响应头到达。</text><text x="586" y="339" font-size="23" style="fill:#147d78" font-weight="400">这段等待不需要 JS</text><text x="586" y="374" font-size="23" style="fill:#147d78" font-weight="400">一直占着主线程。</text><path d="M260 300 L260 329" fill="none" stroke="#8293a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="334" width="448" height="89" rx="12" fill="#edf4ff" stroke="#dae3ed"/><text x="56" y="368" font-size="23" style="fill:#2463c5" font-weight="600">执行调用方后续代码</text><text x="56" y="399" font-size="19" style="fill:#53677f" font-weight="400">之后可处理点击等其他任务。</text><path d="M766 423 L766 454" fill="none" stroke="#8293a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="566" y="459" width="398" height="82" rx="12" fill="#eaf7f4" stroke="#dae3ed"/><text x="586" y="493" font-size="23" style="fill:#147d78" font-weight="600">响应就绪，Promise 成功</text><text x="586" y="524" font-size="19" style="fill:#53677f" font-weight="400">安排 await 的恢复工作。</text><path d="M566 502 L484 502" fill="none" stroke="#8293a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="459" width="448" height="82" rx="12" fill="#fff5e9" stroke="#dae3ed"/><text x="56" y="493" font-size="23" style="fill:#a55517" font-weight="600">在微任务中恢复函数</text><text x="56" y="524" font-size="19" style="fill:#53677f" font-weight="400">拿到 Response，继续执行。</text><text x="36" y="584" font-size="19" style="fill:#53677f" font-weight="400">fetch 成功时响应体未必已读完；读取 JSON 通常还需要 await response.json()。</text><text x="36" y="614" font-size="19" style="fill:#53677f" font-weight="400">事件循环协调回调执行；网络机制由运行环境提供，async 不会创建下载线程。</text></svg>