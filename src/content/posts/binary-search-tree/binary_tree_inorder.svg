<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550" role="img" aria-labelledby="title desc">
  <title id="title">二叉树的中序遍历顺序</title>
  <desc id="desc">根节点14，左孩子7，右孩子18；18的左孩子16，右孩子19。中序访问顺序为7、14、16、18、19。蓝色小圆标记访问次序，灰线仅表示父子关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#5480aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="760" height="550" rx="20" fill="#f8fafc"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="middle">
    <text x="380" y="43" font-size="23" font-weight="700" fill="#20344a">中序遍历：左子树 → 根节点 → 右子树</text>
    <text x="380" y="72" font-size="14" fill="#64748b">灰线表示父子关系 · 蓝色编号表示节点被访问的次序</text>
    <g stroke="#a4b2c1" stroke-width="3" stroke-linecap="round">
      <path d="M 330 130 L 200 225 M 330 130 L 460 225 M 460 225 L 375 325 M 460 225 L 545 325"/>
    </g>
    <g fill="#ffdaa0" stroke="#e9b567" stroke-width="2">
      <circle cx="330" cy="130" r="30"/><circle cx="200" cy="225" r="30"/><circle cx="460" cy="225" r="30"/><circle cx="375" cy="325" r="30"/><circle cx="545" cy="325" r="30"/>
    </g>
    <g font-size="24" font-weight="600" fill="#694719" dominant-baseline="central">
      <text x="330" y="130">14</text><text x="200" y="225">7</text><text x="460" y="225">18</text><text x="375" y="325">16</text><text x="545" y="325">19</text>
    </g>
    <g fill="#2563a6" stroke="#f8fafc" stroke-width="3">
      <circle cx="355" cy="106" r="14"/><circle cx="225" cy="201" r="14"/><circle cx="485" cy="201" r="14"/><circle cx="400" cy="301" r="14"/><circle cx="570" cy="301" r="14"/>
    </g>
    <g font-size="13" font-weight="700" fill="white" dominant-baseline="central">
      <text x="355" y="106">2</text><text x="225" y="201">1</text><text x="485" y="201">4</text><text x="400" y="301">3</text><text x="570" y="301">5</text>
    </g>
    <path d="M 64 383 H 696" stroke="#e0e7ef"/>
    <text x="380" y="415" font-size="15" fill="#64748b">按编号依次访问，得到严格递增序列</text>
    <g fill="white" stroke="#cbd9e8" stroke-width="1.5">
      <rect x="106" y="438" width="68" height="50" rx="12"/><rect x="226" y="438" width="68" height="50" rx="12"/><rect x="346" y="438" width="68" height="50" rx="12"/><rect x="466" y="438" width="68" height="50" rx="12"/><rect x="586" y="438" width="68" height="50" rx="12"/>
    </g>
    <g stroke="#5480aa" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 187 463 H 213"/><path d="M 307 463 H 333"/><path d="M 427 463 H 453"/><path d="M 547 463 H 573"/>
    </g>
    <g font-size="22" font-weight="600" fill="#254e79" dominant-baseline="central">
      <text x="140" y="463">7</text><text x="260" y="463">14</text><text x="380" y="463">16</text><text x="500" y="463">18</text><text x="620" y="463">19</text>
    </g>
    <text x="380" y="522" font-size="14" fill="#64748b">访问顺序：7 → 14 → 16 → 18 → 19</text>
  </g>
</svg>
