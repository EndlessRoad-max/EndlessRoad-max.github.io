<svg xmlns="http://www.w3.org/2000/svg" width="560" height="726" viewBox="0 0 560 726" role="img" aria-labelledby="title desc"><title id="title">上下文到模型的转换</title><desc id="desc">AgentMessage 数组经过可选整理和 convertToLlm 转成 Message 数组，再与 systemPrompt 和工具定义构建模型上下文，经厂商适配发送。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647c"/></marker></defs><rect width="560" height="726" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#24334b"><text x="26" y="40" font-size="25" fill="#24334b" font-weight="650">下一次调用，把上下文送回模型</text><rect x="26" y="66" width="508" height="88" rx="8" fill="#f4f6f9" stroke="#24334b" stroke-width="1.3"/><text x="44" y="99" font-size="23" fill="#24334b" font-weight="650">AgentMessage[]</text><text x="44" y="131" font-size="20" fill="#24334b" font-weight="400">当前上下文：历史 + 本次新增消息</text><path d="M280 158 L280 184" stroke="#52647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="26" y="194" width="508" height="88" rx="8" fill="#f4f6f9" stroke="#24334b" stroke-width="1.3"/><text x="44" y="227" font-size="23" fill="#24334b" font-weight="650">transformContext（可选）</text><text x="44" y="259" font-size="20" fill="#24334b" font-weight="400">可裁剪、整理上下文</text><path d="M280 286 L280 312" stroke="#52647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="26" y="322" width="508" height="88" rx="8" fill="#edf5ff" stroke="#225fa2" stroke-width="1.3"/><text x="44" y="355" font-size="23" fill="#24334b" font-weight="650">convertToLlm</text><text x="44" y="387" font-size="20" fill="#24334b" font-weight="400">转成 pi-ai 的 Message[]</text><path d="M280 414 L280 440" stroke="#52647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="26" y="450" width="508" height="108" rx="8" fill="#f4f6f9" stroke="#24334b" stroke-width="1.3"/><text x="44" y="483" font-size="23" fill="#24334b" font-weight="650">组装 Context</text><text x="44" y="515" font-size="20" fill="#24334b" font-weight="400">messages + systemPrompt</text><text x="44" y="543" font-size="20" fill="#24334b" font-weight="400">+ tools（对模型暴露描述与参数）</text><path d="M280 562 L280 588" stroke="#52647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="26" y="598" width="508" height="88" rx="8" fill="#f4f6f9" stroke="#24334b" stroke-width="1.3"/><text x="44" y="631" font-size="23" fill="#24334b" font-weight="650">厂商适配 → 模型接口</text><text x="44" y="663" font-size="20" fill="#24334b" font-weight="400">转换成具体厂商的请求格式</text></g></svg>