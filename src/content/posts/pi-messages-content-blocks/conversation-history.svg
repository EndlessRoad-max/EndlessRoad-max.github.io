<svg xmlns="http://www.w3.org/2000/svg" width="560" height="674" viewBox="0 0 560 674" role="img" aria-labelledby="title desc"><title id="title">两次工具调用如何进入历史</title><desc id="desc">用户消息，含两个工具调用的模型消息，两条按调用 ID 关联的结果消息，再到下一条模型回答；共五条消息。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647c"/></marker></defs><rect width="560" height="674" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#24334b"><text x="26" y="40" font-size="25" fill="#24334b" font-weight="650">一次提问，可以经历多条消息</text><rect x="26" y="66" width="508" height="78" rx="8" fill="#f4f6f9" stroke="#24334b" stroke-width="1.3"/><text x="44" y="97" font-size="22" fill="#24334b" font-weight="650">[0] user</text><text x="44" y="128" font-size="20" fill="#24334b" font-weight="400">读取 README.md 和 package.json。</text><path d="M280 148 L280 170" stroke="#52647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="26" y="178" width="508" height="110" rx="8" fill="#fff4e6" stroke="#925114" stroke-width="1.3"/><text x="44" y="209" font-size="22" fill="#925114" font-weight="650">[1] assistant · 含两个 toolCall</text><text x="44" y="240" font-size="20" fill="#24334b" font-weight="400">call_001 → README.md</text><text x="44" y="269" font-size="20" fill="#24334b" font-weight="400">call_002 → package.json</text><path d="M280 292 L280 314" stroke="#52647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="26" y="322" width="508" height="78" rx="8" fill="#eaf6f0" stroke="#24694d" stroke-width="1.3"/><text x="44" y="353" font-size="22" fill="#24694d" font-weight="650">[2] toolResult</text><text x="44" y="384" font-size="20" fill="#24334b" font-weight="400">toolCallId: call_001  → 文件一结果</text><path d="M280 404 L280 426" stroke="#52647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="26" y="434" width="508" height="78" rx="8" fill="#eaf6f0" stroke="#24694d" stroke-width="1.3"/><text x="44" y="465" font-size="22" fill="#24694d" font-weight="650">[3] toolResult</text><text x="44" y="496" font-size="20" fill="#24334b" font-weight="400">toolCallId: call_002  → 文件二结果</text><path d="M280 516 L280 538" stroke="#52647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="26" y="546" width="508" height="94" rx="8" fill="#edf5ff" stroke="#225fa2" stroke-width="1.3"/><text x="44" y="577" font-size="22" fill="#225fa2" font-weight="650">[4] assistant · 下一次模型响应</text><text x="44" y="608" font-size="20" fill="#24334b" font-weight="400">根据两条工具结果，说明项目启动方法。</text></g></svg>