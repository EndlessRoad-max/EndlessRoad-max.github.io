<svg xmlns="http://www.w3.org/2000/svg" width="560" height="752" viewBox="0 0 560 752" role="img" aria-labelledby="title desc"><title id="title">工具请求到执行结果</title><desc id="desc">模型生成 ToolCall 数据，程序按 name 找到工具，校验后执行，再生成 toolResult 消息。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647c"/></marker></defs><rect width="560" height="752" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#24334b"><text x="26" y="40" font-size="25" fill="#24334b" font-weight="650">模型提出请求，程序执行函数</text><rect x="26" y="65" width="508" height="162" rx="8" fill="#fff4e6" stroke="#925114" stroke-width="1.3"/><text x="44" y="100" font-size="23" fill="#925114" font-weight="650">ToolCall · 一份请求数据</text><text x="44" y="139" font-size="22" fill="#24334b" font-weight="400">name: &quot;read&quot;     id: &quot;call_001&quot;</text><text x="44" y="176" font-size="21" fill="#24334b" font-weight="400">arguments: { path: &quot;README.md&quot; }</text><text x="44" y="207" font-size="20" fill="#52647c" font-weight="400">放在 assistant.content 中</text><path d="M280 232 L280 276" stroke="#52647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="298" y="260" font-size="19" fill="#52647c" font-weight="400">按 name 查找</text><rect x="26" y="286" width="508" height="112" rx="8" fill="#f4f6f9" stroke="#24334b" stroke-width="1.3"/><text x="44" y="322" font-size="23" fill="#24334b" font-weight="650">context.tools 中的 AgentTool</text><text x="44" y="358" font-size="22" fill="#24334b" font-weight="400">name: &quot;read&quot;     execute: 函数</text><text x="44" y="385" font-size="18" fill="#52647c" font-weight="400">模型看到描述与参数定义；函数留在程序里</text><path d="M280 403 L280 446" stroke="#52647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="26" y="456" width="508" height="76" rx="8" fill="#f4f6f9" stroke="#24334b" stroke-width="1.3"/><text x="44" y="488" font-size="22" fill="#24334b" font-weight="650">准备、校验参数 → 执行 execute()</text><text x="44" y="516" font-size="20" fill="#52647c" font-weight="400">通过必要检查后，才真正读取文件</text><path d="M280 537 L280 580" stroke="#52647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="26" y="590" width="508" height="132" rx="8" fill="#eaf6f0" stroke="#24694d" stroke-width="1.3"/><text x="44" y="625" font-size="22" fill="#24694d" font-weight="650">toolResult · 新增一条结果消息</text><text x="44" y="663" font-size="22" fill="#24334b" font-weight="400">toolCallId: &quot;call_001&quot;</text><text x="44" y="701" font-size="22" fill="#24334b" font-weight="400">content: [读取到的内容]</text></g></svg>