<svg xmlns="http://www.w3.org/2000/svg" width="560" height="694" viewBox="0 0 560 694" role="img" aria-labelledby="title desc"><title id="title">一次流式响应始终更新同一条消息</title><desc id="desc">start 新增一条 assistant 消息，多个 text_delta 更新同一个 content[0]，done 用最终消息替换占位。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647c"/></marker></defs><rect width="560" height="694" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#24334b"><text x="26" y="40" font-size="25" fill="#24334b" font-weight="650">时间向下走，消息位置不变</text><rect x="26" y="68" width="508" height="96" rx="8" fill="#edf5ff" stroke="#225fa2" stroke-width="1.3"/><text x="44" y="103" font-size="21" fill="#225fa2" font-weight="650">start · 新增一条消息</text><text x="44" y="140" font-size="21" fill="#24334b" font-weight="400">assistant  { content: [] }</text><path d="M280 168 L280 203" stroke="#52647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="26" y="212" width="508" height="96" rx="8" fill="#edf5ff" stroke="#225fa2" stroke-width="1.3"/><text x="44" y="247" font-size="21" fill="#225fa2" font-weight="650">text_delta · 新片段「我先」</text><text x="44" y="284" font-size="21" fill="#24334b" font-weight="400">content[0].text = &quot;我先&quot;</text><path d="M280 312 L280 347" stroke="#52647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="26" y="356" width="508" height="96" rx="8" fill="#edf5ff" stroke="#225fa2" stroke-width="1.3"/><text x="44" y="391" font-size="21" fill="#225fa2" font-weight="650">text_delta · 新片段「读取文件」</text><text x="44" y="428" font-size="21" fill="#24334b" font-weight="400">content[0].text = &quot;我先读取文件&quot;</text><path d="M280 456 L280 491" stroke="#52647c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="26" y="500" width="508" height="96" rx="8" fill="#edf5ff" stroke="#225fa2" stroke-width="1.3"/><text x="44" y="535" font-size="21" fill="#225fa2" font-weight="650">done · 保存最终消息</text><text x="44" y="572" font-size="21" fill="#24334b" font-weight="400">同一条 assistant 消息完成</text><text x="30" y="640" font-size="21" fill="#24334b" font-weight="400">delta = 新片段；partial = 已累积的消息</text><text x="30" y="674" font-size="20" fill="#52647c" font-weight="400">Agent 把更新以 message_update 发给界面</text></g></svg>