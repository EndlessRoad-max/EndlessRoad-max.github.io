<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">中序遍历与二分查询</title>
  <desc id="desc">BST 经一次 O(n) 中序遍历变成有序数组。对每个 q 进行 O(log n) 的 lowerBound 查找，再计算 mn 和 mx。总时间 O(n + m log n)。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <rect width="760" height="420" rx="18" fill="#f8fafc"/>
  <g font-family="Microsoft YaHei, sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="380" y="38" font-size="22">一次整理，多次查询</text>
    <g stroke="#94a3b8" stroke-width="2" fill="#fff">
      <rect x="65" y="75" width="170" height="65" rx="10"/>
      <rect x="430" y="75" width="265" height="65" rx="10"/>
      <rect x="65" y="205" width="170" height="65" rx="10"/>
      <rect x="430" y="205" width="265" height="65" rx="10" fill="#dbeafe" stroke="#2563eb"/>
      <rect x="430" y="325" width="265" height="55" rx="10"/>
    </g>
    <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M235 107H418"/><path d="M562 140V193"/><path d="M235 237H418"/><path d="M562 270V313"/>
    </g>
    <g font-size="21">
      <text x="150" y="115">BST root</text><text x="562" y="115">有序数组 a</text>
      <text x="150" y="245">每个查询 q</text><text x="562" y="232">j = lowerBound(a, q)</text>
      <text x="562" y="257" font-size="16">第一个 ≥ q 的下标</text>
      <text x="562" y="359">计算 mn / mx</text>
    </g>
    <g font-size="16" fill="#475569">
      <text x="330" y="91">中序遍历 O(n)</text><text x="330" y="221">二分 O(log n)</text>
      <text x="225" y="360">总时间 O(n + m log n)</text>
    </g>
  </g>
</svg>
